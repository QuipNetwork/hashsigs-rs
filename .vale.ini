[*.{md,txt,rst}]
# SHRINCS/SPHINCS+ build-profile names ("128s", "256s", "q18", "q20") match
# Google.Units' digit+letter regex (it reads "128s" as "128 seconds"), but
# they are profile identifiers, not measurements. Disabling avoids degrading
# the profile names to satisfy a false positive.
Google.Units = NO

# "backend" is the term PEP 517 itself uses: the `build-backend` key in
# pyproject.toml names the module that builds the distribution. Microsoft's
# A-Z list prefers "back end", which would not match the specification, the
# configuration key, or the module name. Keeping the precise term beats
# satisfying a style list written for a different domain.
Microsoft.Avoid = NO
