build-test:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - rustup target add wasm32-unknown-unknown
  script:
    - cargo test --locked --features wasm-bindings
    # The sha2 profile shares every crypto constant with the default 256s
    # profile, so its suite costs about the same to test. It gets a full test
    # run rather than a check: it is the only profile whose scheme hashes are
    # SHA-256, and its committed vectors anchor the Solidity sha2 verifier.
    - cargo test --locked --features profile-256s-sha2
    # All six profiles compile into one build; this is the only job that
    # proves they coexist, including profiles::tests::profiles_that_differ_only_by_suite_coexist.
    - cargo test --locked --all-features
    # Default-profile wasm build (no profile-* feature). ts-conformance rebuilds
    # only when packaging via npm run build → build-wasm.sh.
    - cargo build --locked --release --target wasm32-unknown-unknown --features wasm-bindings

# 128s profiles: full cargo test in release (not check-only). Unignored tests
# build a 2^18-leaf hypertree; debug is unusable (>25 min without finishing a
# test). Separate job so wall-clock is visible and so this parallelizes with
# build-test / clippy / ts-conformance. Manual mirror: bin/test-shrincs-profiles.sh.
test-128s:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo test --locked --release --features experimental-profile-128s-q18
    - cargo test --locked --release --features experimental-profile-128s-q20
    # The sha2 twins run the library suite, which includes the SPHINCS
    # vector-conformance tests against their committed golden vectors (171
    # passed under each). Their integration tests are held back: the ERC-7913
    # adapter pins bytes against account-wrapper vectors, a separate family
    # generated in hashsigs-solidity and copied here, which does not exist for
    # these two profiles. --all-targets is still checked so the integration
    # tests keep compiling. Raise --lib to a full `cargo test` once
    # tests/test_vectors/shrincs_account_wrapper_vectors_128s_q{18,20}_sha2.json.gz
    # land.
    - cargo test --locked --release --lib --features experimental-profile-128s-q18-sha2
    - cargo test --locked --release --lib --features experimental-profile-128s-q20-sha2
    - cargo check --locked --release --all-targets --features experimental-profile-128s-q18-sha2
    - cargo check --locked --release --all-targets --features experimental-profile-128s-q20-sha2

# Solana workspace member is not a default member of the root package, so it
# never ran under bare `cargo test`. solana-program-test spins up a validator
# harness; keep cost visible as its own job.
test-solana:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo test --locked -p hashsigs-rs-solana

# Static clippy gate. The profile features are additive, so one --all-features
# invocation lints every profile plus wasm-bindings, solana, heap-buffers, and
# parallel together. Also lint the non-default Solana workspace member, which
# the profile features do not apply to. Formatting is enforced separately by
# the `fmt` job below.
clippy:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --all-targets -p hashsigs-rs-solana --locked -- -D warnings
    - cargo clippy --all-targets --all-features --locked -- -D warnings

# Formatting gate. rustfmt only parses (no compile), so this is fast and needs
# no build cache. The tree is fully rustfmt-clean; this keeps it that way.
fmt:
  stage: test
  image: rust:1.95.0
  extends: .mr-default-rules
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all --check
    - bin/check-production-profiles.sh

# Rustdoc lint gate: broken intra-doc links and rustdoc warnings fail CI,
# guarding the public-API docs and the runnable doc examples.
rustdoc:
  stage: test
  image: rust:1.95.0
  extends: [.rust-cache, .mr-default-rules]
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --no-deps --locked

# Minimum-supported-Rust-version floor. Pinned to the declared rust-version
# (Cargo.toml `rust-version = "1.95"`) independently of any future bump to the
# other jobs' image, so an accidental MSRV increase fails here first.
msrv:
  stage: test
  image: rust:1.95.0
  extends: [.rust-cache, .mr-default-rules]
  script:
    - cargo build --locked --features wasm-bindings

# Supply-chain gate: RustSec advisories, license allow-list, banned/duplicate
# crates, and source allow-list, per deny.toml. cargo-deny is cached in
# .cargo-home/bin across runs (first cold run compiles it).
supply-chain:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  # Unlike the other static gates, this one also runs on tag pipelines:
  # advisories are time-dependent, so a lockfile that was clean when the SHA
  # merged can be freshly vulnerable by the time it is tagged for release.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - !reference [.install-cargo-deny, before_script]
  script:
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - cargo deny check

# Semver advisory: report public-API breaking changes against the last
# published release. Advisory only (allow_failure) — this crate makes
# intentional breaking changes pre-1.0, so the job surfaces them for release
# notes without blocking the pipeline. Baselines against the crates.io release;
# a not-yet-published crate simply yields an allowed failure.
semver:
  stage: test
  image: rust:1.95.0
  extends: [.rust-cache, .mr-default-rules]
  allow_failure: true
  before_script:
    - !reference [.install-cargo-semver-checks, before_script]
  script:
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    # Never let the tool pick features: its default heuristic enables every
    # feature at once, which compiles all four SHRINCS profiles and binds the
    # single-profile surfaces to whichever the priority order picks. That
    # changes what the comparison measures between runs. --default-features
    # keeps each version on its own default profile; the additive
    # host-compatible features are added explicitly. Features absent from the
    # baseline warn, not error.
    - cargo semver-checks check-release --default-features --features solana --features heap-buffers --features wasm-bindings --features parallel

# Conformance test against the BUILT package (dist/): loaders, exports map,
# ESM/CJS scoping, base64-inline path — the layer cargo tests never touch.
# npm run build already runs build-wasm.sh + npm test once; do not invoke them
# again here.
#
# This builds one wasm binary per published profile (six), each preceded by a
# `cargo clean -p hashsigs-rs` because the cdylib output path is shared, so the
# wasm compile step costs roughly six times a single-profile build. The test
# suite itself stays cheap: it drives the full crypto surface only on the 256s
# profiles and identity-checks the rest, because 128s keygen through wasm
# takes about 53 seconds.
ts-conformance:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.install-node-pinned, before_script]
    - !reference [.install-wasm-bindgen, before_script]
  script:
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - cd ts && npm ci
    - npm run build

# The Python bindings, against the BUILT wheel rather than the source tree:
# the per-profile extensions only exist once bin/build-python.sh has staged
# them, and the package resolves its profile manifest from the installed
# location.
#
# Like the wasm build, this compiles one artifact per profile, so the cargo
# step costs roughly six times a single-profile build. The suite drives the
# full signing surface on the default profile, checks profile identity on all
# six, and signs on the 256s pair only -- 128s keygen costs tens of seconds.
py-tests:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.install-python-build, before_script]
  script:
    # `build` with no flags builds the sdist and then builds the wheel FROM
    # that sdist, so this one command covers the source-install path that
    # `pip install --no-binary` takes. Both go through py/hashsigs_build.py,
    # the PEP 517 backend that compiles one extension per profile before
    # handing off to maturin; a bare `maturin build` skips it and produces a
    # wheel with no extensions.
    - /tmp/py-venv/bin/python -m build --outdir /tmp/dist .
    # The wheel came from the sdist, so a source file missing from the sdist
    # shows up as a missing extension here. Also checks the platform tag, so a
    # wheel PyPI would reject fails on a merge request rather than at upload.
    - /tmp/py-venv/bin/python bin/check-wheel.py /tmp/dist
    - /tmp/py-venv/bin/pip install --quiet --force-reinstall /tmp/dist/*.whl
    # Run from py/ so the installed package is imported, never py/python/.
    - cd py && /tmp/py-venv/bin/python -m pytest tests/ -q
