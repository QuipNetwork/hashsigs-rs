build-test:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - rustup target add wasm32-unknown-unknown
  script:
    - cargo test --locked --features wasm-bindings
    # The sha2 profile shares every crypto constant with the default 256s
    # profile, so its suite costs about the same to test. It gets a full test
    # run rather than a check: it is the only profile whose scheme hashes are
    # SHA-256, and its committed vectors anchor the Solidity sha2 verifier.
    - cargo test --locked --features profile-256s-sha2
    # Default-profile wasm build (no profile-* feature). ts-conformance rebuilds
    # only when packaging via npm run build → build-wasm.sh.
    - cargo build --locked --release --target wasm32-unknown-unknown --features wasm-bindings

# 128s profiles: full cargo test in release (not check-only). Unignored tests
# build a 2^18-leaf hypertree; debug is unusable (>25 min without finishing a
# test). Separate job so wall-clock is visible and so this parallelizes with
# build-test / clippy / ts-conformance. Manual mirror: bin/test-shrincs-profiles.sh.
test-128s:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo test --locked --release --features profile-128s-q18
    - cargo test --locked --release --features profile-128s-q20

# Solana workspace member is not a default member of the root package, so it
# never ran under bare `cargo test`. solana-program-test spins up a validator
# harness; keep cost visible as its own job.
test-solana:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo test --locked -p hashsigs-rs-solana

# Static clippy gate. Profile features are mutually exclusive, so lint each
# feature set CI tests in a separate invocation (not --all-features). Also lint
# the non-default Solana workspace member. Formatting is enforced separately by
# the `fmt` job below.
clippy:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --all-targets --features wasm-bindings --locked -- -D warnings
    - cargo clippy --all-targets -p hashsigs-rs-solana --locked -- -D warnings
    - cargo clippy --all-targets --features profile-128s-q18 --locked -- -D warnings
    - cargo clippy --all-targets --features profile-256s-sha2 --locked -- -D warnings

# Formatting gate. rustfmt only parses (no compile), so this is fast and needs
# no build cache. The tree is fully rustfmt-clean; this keeps it that way.
fmt:
  stage: test
  image: rust:1.95.0
  extends: .mr-default-rules
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all --check

# Rustdoc lint gate: broken intra-doc links and rustdoc warnings fail CI,
# guarding the public-API docs and the runnable doc examples.
rustdoc:
  stage: test
  image: rust:1.95.0
  extends: [.rust-cache, .mr-default-rules]
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --no-deps --locked

# Minimum-supported-Rust-version floor. Pinned to the declared rust-version
# (Cargo.toml `rust-version = "1.95"`) independently of any future bump to the
# other jobs' image, so an accidental MSRV increase fails here first.
msrv:
  stage: test
  image: rust:1.95.0
  extends: [.rust-cache, .mr-default-rules]
  script:
    - cargo build --locked --features wasm-bindings

# Supply-chain gate: RustSec advisories, license allow-list, banned/duplicate
# crates, and source allow-list, per deny.toml. cargo-deny is cached in
# .cargo-home/bin across runs (first cold run compiles it).
supply-chain:
  stage: test
  image: rust:1.95.0
  extends: [.rust-cache, .mr-default-rules]
  before_script:
    - !reference [.install-cargo-deny, before_script]
  script:
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - cargo deny check

# Semver advisory: report public-API breaking changes against the last
# published release. Advisory only (allow_failure) — this crate makes
# intentional breaking changes pre-1.0, so the job surfaces them for release
# notes without blocking the pipeline. Baselines against the crates.io release;
# a not-yet-published crate simply yields an allowed failure.
semver:
  stage: test
  image: rust:1.95.0
  extends: [.rust-cache, .mr-default-rules]
  allow_failure: true
  before_script:
    - !reference [.install-cargo-semver-checks, before_script]
  script:
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    # Never let the tool pick features: its default heuristic enables every
    # feature at once, and the four SHRINCS profile features are mutually
    # exclusive (build.rs panics). --default-features keeps each version on
    # its own default profile; the additive host-compatible features are
    # added explicitly. Features absent from the baseline warn, not error.
    - cargo semver-checks check-release --default-features --features solana --features heap-buffers --features wasm-bindings --features parallel

# Conformance test against the BUILT package (dist/): loaders, exports map,
# ESM/CJS scoping, base64-inline path — the layer cargo tests never touch.
# npm run build already runs build-wasm.sh + npm test once; do not invoke them
# again here.
ts-conformance:
  stage: test
  image: rust:1.95.0
  extends: .rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.install-node-pinned, before_script]
    - !reference [.install-wasm-bindgen, before_script]
  script:
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - cd ts && npm ci
    - npm run build
