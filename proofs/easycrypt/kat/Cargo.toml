[package]
name = "shrincs-kat"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
description = "Writes the EasyCrypt known-answer test files for hashsigs-rs"
publish = false

[[bin]]
name = "gen-kats"
path = "src/main.rs"

[dependencies]
hashsigs-rs = { path = "../../..", features = ["kat-trace"] }
serde_json = "1.0.151"
# Reads the committed golden vector of the crate, which is gzip-compressed.
flate2 = "1.1.2"
