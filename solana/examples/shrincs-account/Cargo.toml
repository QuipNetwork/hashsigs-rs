[package]
name = "shrincs-account-example"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
authors = ["Richard T. Carback III <rick.carback@gmail.com>"]
description = "Solana example program demonstrating the SHRINCS account pattern"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/hashsigs-rs"
publish = false

[lib]
name = "shrincs_account_example"
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
default = ["custom-heap"]

[dependencies]
solana-program = "4.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
borsh = "1.5.7"
hashsigs-rs = { path = "../../..", features = ["solana", "profile-128s-q18"] }
hashsigs-rs-solana = { path = "../..", default-features = false, features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = { version = "4.1", features = ["agave-unstable-api"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-pubkey = "4.2"
solana-transaction = "4.1"
solana-sdk-ids = "3.0"
# solana-account must track the version solana-program-test exposes in its
# API (AccountSharedData in add_account/set_account signatures).
solana-account = "4.3"
solana-transaction-error = "3.2"
tokio = { version = "1.48.0", features = ["full"] }
