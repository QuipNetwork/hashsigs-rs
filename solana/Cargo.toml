[package]
name = "hashsigs-rs-solana"
version = "0.0.1"
edition = "2021"
authors = ["Richard T. Carback III <rick.carback@gmail.com>"]
description = "Solana program for WOTS+"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "4.0"
hashsigs-rs = { path = "..", features = ["heap-buffers"] }
borsh = "1.5.7"
bytemuck = "1.24"
bytemuck_derive = "1.10.2"  # Updated to satisfy Solana 2.3
solana-system-interface = { version = "3.2", features = ["bincode"] }

[dev-dependencies]
solana-program-test = { version = "4.1", features = ["agave-unstable-api"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-pubkey = "4.2"
solana-transaction = "4.1"
solana-sdk-ids = "3.0"
tokio = { version = "1.48.0", features = ["full"] }
