[package]
name = "hashsigs-rs-solana"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
authors = ["Richard T. Carback III <rick.carback@gmail.com>"]
description = "Solana program for WOTS+"
license = "AGPL-3.0-or-later"
repository = "https://github.com/quipnetwork/hashsigs-rs"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Replaces the entrypoint's default 32 KiB-bounded bump allocator with an
# unbounded one so ComputeBudgetInstruction::request_heap_frame actually
# extends usable heap (the VM enforces the granted frame size).
custom-heap = []
default = ["custom-heap"]

[dependencies]
solana-program = "4.0"
hashsigs-rs = { path = "..", features = ["solana", "heap-buffers"] }
borsh = "1.5.7"
bytemuck = "1.24"
bytemuck_derive = "1.10.2"
solana-system-interface = { version = "3.2", features = ["bincode"] }

[dev-dependencies]
solana-program-test = { version = "4.1", features = ["agave-unstable-api"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-pubkey = "4.2"
solana-transaction = "4.1"
solana-sdk-ids = "3.0"
tokio = { version = "1.48.0", features = ["full"] }
