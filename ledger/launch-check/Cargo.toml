[package]
name = "hashsigs-ledger-launch-check"
version = "0.1.0"
authors = ["hashsigs-rs contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
ledger_device_sdk = { version = "=1.36.1", features = ["io_new", "sys"] }

[package.metadata.ledger]
name = "SHRINCS Launch"
curve = ["slip21"]
path = []
path_slip21 = ["quip.network/SHRINCS/LAUNCH-CHECK/v1"]
flags = "0"
apex_p = { icon = "../app/icons/crab_32x32.png" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p"))'] }
