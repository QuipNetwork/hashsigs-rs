[package]
name = "hashsigs-py"
# Keep in lockstep with the root crate: maturin derives the PyPI version
# (0.2.1-rc1 -> 0.2.1rc1 under PEP 440) from this field.
version = "0.2.1-rc3"
edition = "2021"
rust-version = "1.95"
authors = ["Richard T. Carback III <rick.carback@gmail.com>"]
description = "Python bindings for hashsigs-rs (WOTS+ and SHRINCS)"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/hashsigs-rs"
# PyPI-only artifact: the wheel ships through maturin, never through cargo.
publish = false

[lib]
name = "hashsigs"
crate-type = ["cdylib"]

[dependencies]
hashsigs-rs = { path = ".." }
# abi3-py39: one wheel per platform covers CPython 3.9+. extension-module
# leaves libpython unlinked, as a wheel requires; it also means `cargo test`
# cannot link this crate, so tests run through maturin/pytest, not cargo.
pyo3 = { version = "0.29.2", features = ["abi3-py39", "extension-module"] }
