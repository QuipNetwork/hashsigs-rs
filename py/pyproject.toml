[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "hashsigs"
description = "Hash-based signatures: SHRINCS and SPHINCS+C, backed by hashsigs-rs. Every SHRINCS profile ships in this one distribution, each on its own import path."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9"
authors = [{ name = "Richard T. Carback III", email = "rick.carback@gmail.com" }]
keywords = ["cryptography", "wots", "shrincs", "signature"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security :: Cryptography",
]
# Version comes from py/Cargo.toml so the workspace has one source of truth.
dynamic = ["version"]

[project.urls]
Repository = "https://gitlab.com/quip.network/hashsigs-rs"

[tool.maturin]
# The wheel is a mixed project: the `hashsigs` package is hand-written Python
# under python/, and maturin compiles ONE extension into it -- the small
# version module. The six per-profile extensions are built separately by
# bin/build-python.sh and staged into python/hashsigs/_ext/ before this runs,
# because one Cargo package builds at most one cdylib.
python-source = "python"
module-name = "hashsigs._hashsigs"
# Ship the staged extensions and the generated profile modules.
include = [
  { path = "python/hashsigs/_ext/*.abi3.so", format = "wheel" },
  { path = "python/hashsigs/profiles/profiles.json", format = "wheel" },
  { path = "python/hashsigs/py.typed", format = "wheel" },
]
