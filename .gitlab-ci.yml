# CI for hashsigs-rs.
#
# - On merge requests and the default branch: build + test the crate (incl. the
#   wasm target) so regressions are caught before merge.
# - On a version tag (e.g. v0.2.0): run a minimal test+ts gate, then build the
#   wasm, pack the ts/ package, and publish @quip.network/hashsigs-wasm at the
#   tag's version to npm. Tag pipelines must not publish untested SHAs.
#
# Publishing uses npm OIDC trusted publishing (tokenless): GitLab mints a
# short-lived NPM_ID_TOKEN via `id_tokens`, npm exchanges it for publish
# credentials, and provenance attestations are generated automatically. There
# is no long-lived NPM_TOKEN. A "Trusted Publisher" must be configured on
# npmjs.com for @quip.network/hashsigs-wasm (namespace/project/CI-file path)
# with `npm stage publish` allowed.
#
# RUNNER SPLIT: npm trusted publishing only works on gitlab.com shared runners,
# not self-hosted runners. So the heavy Rust/wasm build runs on the self-hosted
# fleet (tag `x86_64`) and produces a packed tarball artifact; a lightweight
# publish job runs on a shared runner (tag `saas-linux-small-amd64`) and stages
# that prebuilt tarball. Publishing a tarball skips the prepack rebuild, so the
# shared runner needs only Node + npm. Shared runners must be enabled on the
# project (Settings -> CI/CD -> Runners).
#
# npm staging requires the package to already exist, and OIDC trusted publishing
# can only be configured on an existing package. So the very first publish is
# done once by a maintainer locally (`npm publish` with 2FA) to create the
# package; CI never bootstraps it. Thereafter every tagged release is staged via
# CI (`npm stage publish`) and a maintainer approves it with 2FA before it goes
# live.
#
# The wasm-bindgen CLI version MUST equal the crate's wasm-bindgen dependency
# (0.2.100) or wasm-bindgen emits a schema-mismatch error.
# Node major is pinned to 22 (LTS) for the TS packaging jobs. npm is upgraded to
# NPM_VERSION because trusted publishing needs >=11.5.1 and staging >=11.15.0,
# while Node 22.14 ships npm 10.x.

# When more than one registry publishes, they go in order of how hard each is
# to undo, easiest first, so a failure strands as little as possible.
#
#   npm     an unwanted version can be unpublished within 72 hours
#   pypi    a release can be deleted, but its filenames can never be reused
#   crates  a version can only be yanked, never replaced or re-uploaded
#
# Publishing the hardest one first and failing on an easier one behind it
# spends a version number that cannot be reclaimed. Later plans add a stage per
# registry in that order, and make the crates.io job `needs:` the other two, so
# the ordering holds even if a stage is reordered by accident.
stages: [test, package, publish]

variables:
  WASM_BINDGEN_VERSION: "0.2.100"
  # sha256 of wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz
  # from https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/
  # Verified by downloading the release asset (2026-07-23).
  WASM_BINDGEN_SHA256: "63d6a38deb65bd7023c02bdf382ab66b0d2c0241c8582fd3413b5a808b8aeb5b"
  # cargo-deny / cargo-semver-checks prebuilt musl binaries, pinned like
  # wasm-bindgen above. SHA256 is of the x86_64-unknown-linux-musl release
  # tarball, verified by downloading the asset (2026-07-25).
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  CARGO_SEMVER_CHECKS_VERSION: "0.49.0"
  CARGO_SEMVER_CHECKS_SHA256: "f25b4fcf842fc8a18fd6f1d9475513dc74ef2c9df201252b9b9d2f6edb6ab6a2"
  # Node 22 LTS; install from nodejs.org tarball so the major is fixed (not
  # whatever Debian ships under apt `nodejs`).
  NODE_MAJOR: "22"
  NODE_VERSION: "22.14.0"
  # npm >= 11.15.0 is required for `npm stage publish`; pin for reproducibility.
  # Stay on 11.x: npm 12 needs Node >= 22.22, but Node is pinned to the 22.14.0
  # trusted-publishing floor. npm 11.18 engine is node >=22.9, so it's compatible.
  NPM_VERSION: "11.18.0"
  # sha256 of https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt, pinned
  # like the tool tarballs above so the Node toolchain download is
  # integrity-checked too (one pin covers every arch's tarball line).
  # Verified by downloading the file (2026-08-21).
  NODE_SHASUMS256_SHA256: "d67cdb735b1764bf5b553a0d9b067ed861b91a4d934afc20442c04f5234b55db"
  # Keep cargo home inside the project so GitLab cache can capture registry,
  # git checkouts, and installed binaries (e.g. wasm-bindgen). Use .cargo-home
  # (not .cargo) so the committed .cargo/config.toml tree is not mixed with the
  # writable cargo home.
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"

include:
  - local: .gitlab/ci/setup.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/release.yml
