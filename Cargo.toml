[package]
name = "hashsigs-rs"
version = "0.2.1-rc9"
edition = "2021"
rust-version = "1.95"
authors = ["Richard T. Carback III <rick.rust.cargo.383d5@passmail.net>"]
description = "Hash-based signatures core library with WOTS+ and SHRINCS primitives"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/hashsigs-rs"
homepage = "https://github.com/quipnetwork/hashsigs-rs"
documentation = "https://docs.rs/hashsigs-rs"
readme = "README.md"
keywords = ["cryptography", "wots", "shrincs", "signature", "solana"]
categories = ["cryptography", "authentication", "no-std"]
build = "build.rs"
# Keep the published crate to what a consumer can actually use. The test
# vectors and fixtures stay: they are what lets `cargo test` verify a
# downloaded crate against the reference implementation, which is the point of
# shipping them. Everything below is repository infrastructure -- notably a
# 1.2 MB slide deck that was a third of the tarball.
exclude = [
  "docs/",
  ".gitlab/",
  ".gitlab-ci.yml",
  ".beads/",
  "bin/",
  # npm packaging tree (py/ and solana/ are workspace members, excluded
  # automatically; ts/ is not, and ~40 KB of TypeScript packaging
  # infrastructure has no value to a Rust consumer).
  "ts/",
  "AGENTS.md",
  "CLAUDE.md",
]

[lib]
name = "hashsigs_rs"
path = "src/lib.rs"
# rlib only: a host `no_std` build cannot link a cdylib (needs panic_handler +
# global allocator). Wasm packaging requests cdylib via `cargo rustc
# --crate-type cdylib` in bin/build-wasm.sh.
crate-type = ["rlib"]

[workspace]
members = [
    "py",
    "py/common",
    "py/profiles/p256s",
    "py/profiles/p256s_sha2",
    "py/profiles/p128s_q18",
    "py/profiles/p128s_q20",
    "py/profiles/p128s_q18_sha2",
    "py/profiles/p128s_q20_sha2",
    "solana",
    "solana/examples/shrincs-account"
]
resolver = "2"

# One pyo3 version for every crate that builds a Python extension. The PyO3
# attribute macros expand to `::pyo3` paths, so each profile crate needs the
# dependency directly even though the surface it stamps out comes from
# hashsigs-py-common. Pinning it here is what stops seven manifests drifting.
#
# abi3-py39: one wheel per platform covers CPython 3.9+. extension-module
# leaves libpython unlinked, as a wheel requires.
[workspace.dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py39", "extension-module"] }

[features]
default = ["std", "default-profile-256s"]
# Host/runtime surface: serde std, env-based debug traces.
std = ["alloc", "serde/std"]
# Heap types (Vec/Box/String) used by signature wire types and pack helpers.
alloc = []
# Optional Solana program dependency + syscall hash routing (also auto-selected
# on target_os = "solana" via cfg in hash_backend).
solana = ["dep:solana-program"]
# SHRINCS parameter profiles. These are additive: enabling two features
# compiles two instantiations that coexist in one build. Each mirrors the
# Solidity contracts/profiles/<profile>/SHRINCSParams.sol library.
#
# Counts stay compile-time constants (no runtime params struct): each profile
# is a type implementing `Profile`, and the algorithms are generic over it.
# The `*-sha2` profiles (`profile-256s-sha2`, `experimental-profile-128s-q18-sha2`,
# `experimental-profile-128s-q20-sha2`) use SHA-256 for the internal scheme hashes while
# keeping EVM-domain hashes (profile identity, commitments, canonical action
# hashes) on keccak to match Solidity. Each is the exact numeric twin of the
# keccak profile it is named after. Every 128-bit feature is deliberately
# prefixed `experimental-`: its stateless-signature limit lacks an approved
# documented birthday-bound analysis. These features are for tests, vectors,
# and research, and are not selected by default or by release jobs.
#
# The non-generic facades (`ShrincsVerifier`, the wasm bindings, the
# golden-vector tests) still bind to one profile, which build.rs picks.
#
# `default-profile-256s` marks 256s as on only because it is the default, so
# that `--features experimental-profile-128s-q18` (which, features being additive, leaves
# the default enabled) still BINDS to q18 instead of silently testing 256s.
# Naming a profile explicitly overrides the default; naming several, or
# `--all-features`, falls back to the fixed order profile-256s,
# profile-256s-sha2, experimental-profile-128s-q18, experimental-profile-128s-q20, experimental-profile-128s-q18-sha2,
# experimental-profile-128s-q20-sha2 so the choice stays deterministic. New profiles are
# appended to that order, never inserted, so an existing multi-profile build
# keeps binding to the profile it bound to before. Every enabled profile
# compiles either way.
default-profile-256s = ["profile-256s"]
profile-256s = []
experimental-profile-128s-q18 = []
experimental-profile-128s-q20 = []
profile-256s-sha2 = []
experimental-profile-128s-q18-sha2 = []
experimental-profile-128s-q20-sha2 = []
# Heap-back the WOTS+ segment accumulator instead of using a stack array.
# Solana BPF stack frames are 4 KB, well under SIGNATURE_SIZE, so on-chain
# builds must opt in. Native and wasm builds keep the stack array.
heap-buffers = []
wasm-bindings = [
    "std",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:tsify",
    "dep:js-sys",
]
# Parallelize grind searches, batched leaf generation, and WOTS-C chain
# endpoint computation with rayon. Off by default; never implied by any
# other feature (rayon pulls in a thread pool, unsuitable for wasm targets).
# Requires std: rayon has no no_std support.
parallel = ["std", "dep:rayon"]

[dependencies]
solana-program = { version = "4.0", optional = true }
# Portable hash backends (no_std-capable). Used when not on Solana / without
# the `solana` feature. Keep in lockstep with the build-dep sha3 major line.
sha3 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
rayon = { version = "1.12", optional = true }
# =0.5.5: last tsify accepting wasm-bindgen 0.2.100, which the wasm-bindgen CLI
# pin in bin/build-wasm.sh must match exactly (0.5.6 forces ^0.2.104).
tsify = { version = "=0.5.5", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "=0.2.100", optional = true }

[dev-dependencies]
flate2 = "1.1.2"
serde_json = "1.0.151"
wasm-bindgen-test = "0.3.50"
# Independent oracle for the portable sha3/sha2 hash backend: golden-vector
# generators hash the same inputs via solana-program directly and assert
# byte-identical output against hash_backend's default (non-`solana`-feature)
# sha3/sha2 path. Dev-only — never ships in the published library artifact.
solana-program = "4.0"
# Compile-fail harness: proves assert_widths rejects a mismatched const
# generic width at compile time (see tests/compile_fail.rs).
trybuild = "1.0.120"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.3.3", features = ["wasm_js"] }
# The solana-program 4.x dev-dep (hash-backend oracle) reaches getrandom 0.2
# via solana-secp256k1-recover -> k256 -> rand_core. getrandom 0.2 refuses to
# build for wasm32-unknown-unknown unless its "js" feature is on. This renamed
# dep exists only to switch that feature on for wasm32 test compiles; the
# published wasm artifact never builds dev-deps and stays free of both.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.11.0"

[build-dependencies]
sha3 = "0.10"

# Opt-level 2 for tests: hash-tree-heavy debug (opt-level 0) is the root cause of
# 128s profile slowness (>25 min without finishing a test). Keep default
# debug-assertions and overflow-checks (on) so test builds still catch bugs.
[profile.test]
opt-level = 2
