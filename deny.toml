# cargo-deny configuration — supply-chain policy enforced in CI (the
# `supply-chain` job runs `cargo deny check`). Run locally with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# RustSec advisory database. Vulnerabilities fail the check by default; a
# transitive advisory with no available fix may be added to `ignore` below with
# a dated justification rather than left silently unaddressed.
version = 2
yanked = "deny"
ignore = [
    # bincode unmaintained — transitive via the Solana dep tree only, no
    # upstream fix, no known vulnerability, not on any hashsigs code path.
    "RUSTSEC-2025-0141",
    # libsecp256k1 unmaintained — transitive via the Solana dep tree only;
    # hashsigs uses no secp256k1 functionality.
    "RUSTSEC-2025-0161",
]

[licenses]
# Every license observed in the dependency graph as of 2026-07-24 plus the
# workspace crates' own AGPL-3.0-or-later. All are OSI-approved / permissive.
# A new dependency introducing a license not listed here fails CI on purpose —
# add it deliberately, don't loosen the policy by reflex.
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# The Solana dependency tree pulls many crates and legitimately carries several
# duplicated versions (base64, borsh, rand, syn, ...), so multiple-versions is a
# warning, not a hard failure. Wildcard version specs are banned — this crate
# pins exact (`=x.y.z`) versions for wasm-bindgen/tsify, never `*`.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git or alternative-registry dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
